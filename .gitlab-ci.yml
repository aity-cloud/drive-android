# Aity Drive for Android - Factory pipeline (spec: drive/meta specs/aity-drive-v1.md).
#
# CI is the only builder and publisher; humans only run `promote`.
# Runs on main pushes and on release tags shaped `v<upstream>-aity-<n>`
# (e.g. v4.8.3-aity-1). Every release builds BOTH Environment builds.

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.+-aity-\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  # renovate: datasource=github-tags depName=owncloud/android
  UPSTREAM_TAG: "v4.8.3"

stages:
  - materialize
  - build
  - smoke
  - publish-staging
  - promote
  - mirror

# Every job runs on our own runner unless it explicitly overrides (the macOS
# jobs do). gitlab.com instance runners are disabled for the whole aity-cloud
# group since 2026-08-27 - drive/desktop's Windows build is the only exception -
# so a new job that forgets `tags:` sits stuck-pending instead of silently
# burning purchased compute minutes.
default:
  tags: [docker, shared]
  interruptible: true

include:
  - project: aity-cloud/drive/meta
    ref: main
    file: ci/mirror.yml

# Fast gate: the Pin still materializes and every Patch still applies, for
# both Environments, before anything heavier starts.
materialize:
  stage: materialize
  image: registry.aity.tech/catalog/library/alpine:3.22
  tags: [docker, shared]
  interruptible: true
  script:
    - apk add --no-cache bash git >/dev/null
    - bash scripts/materialize.sh production
    - bash scripts/materialize.sh staging

# Both Environment builds: AAB + APK each, unit tests of the materialized
# tree. versionName comes from the tag (dev on main), versionCode is
# CI_PIPELINE_IID. Signing uses the upload keystore when the protected
# variables exist and falls back to a throwaway debug keystore otherwise
# (never fails for missing signing; the log says which one it used).
# Image choice: see MAINTAINING.md.
build:
  stage: build
  image: ghcr.io/cirruslabs/android-sdk:36
  tags: [docker, shared]
  interruptible: true
  timeout: 2h
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  cache:
    key: gradle-$UPSTREAM_TAG
    paths:
      - .gradle-home/caches/modules-2
      - .gradle-home/wrapper
  script:
    - bash scripts/ci-build.sh
  artifacts:
    name: aity-drive-android-$CI_PIPELINE_IID
    expire_in: 30 days
    paths:
      - dist/
    reports:
      junit: reports/junit/*.xml

# Tier 2b: the account journey on an emulator, against drive.aity.works.
# Signs in with the real drive-android OIDC client (the app's own
# authorization request, PKCE verifier and token exchange - only the system
# browser is stood in for, see the test's KeycloakBrowser), sees a file that
# was seeded over WebDAV before launch, creates a folder from the app, removes
# it again and leaves staging clean.
#
# Runs on the macos runner because that is where the hardware-accelerated
# emulator is (Apple Silicon arm64-v8a image); the script picks the ABI from
# the host, so it runs unchanged on any Linux runner with a working /dev/kvm.
# Manual: the Mac is Raul's laptop and one job at a time (runbooks/mac-runner.md).
#
# needs: [] on purpose - this job re-materialises and rebuilds on the Mac and
# consumes nothing from `build`, so waiting for the Linux runner would only
# couple it to a machine it does not use.
smoke:emulator:
  stage: smoke
  tags: [macos]
  when: manual
  needs: []
  timeout: 1h
  script:
    - bash scripts/emulator-smoke.sh staging
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - reports/emulator/

# The pass-rate measurement (MAINTAINING.md, "Tier 2b: how the Custom Tab is
# stood in for"). Reports the rate; only a 0/N is a hard failure.
measure:emulator-flakiness:
  stage: smoke
  tags: [macos]
  when: manual
  needs: []
  allow_failure: true
  timeout: 2h
  variables:
    AITY_SMOKE_REPEAT: "5"
  script:
    - bash scripts/emulator-smoke.sh staging
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - reports/emulator/

# Staging Environment build -> Play internal track of tech.aity.drive.staging.
# Manual, and a clear no-op until the Play service account exists.
publish-staging:
  stage: publish-staging
  image: registry.aity.tech/catalog/library/alpine:3.22
  tags: [docker, shared]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.+-aity-\d+$/
      when: manual
      allow_failure: true
  needs: [build]
  script:
    - |
      if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
        echo "NO-OP: PLAY_SERVICE_ACCOUNT_JSON is not set (no Google Play"
        echo "service account yet - M0). Skipping the Play internal upload;"
        echo "the staging AAB stays available as a pipeline artifact under dist/staging/."
        exit 0
      fi
    - apk add --no-cache bash ruby ruby-dev build-base >/dev/null
    - gem install bundler --no-document
    - bundle install
    - bundle exec fastlane android deploy aab:$(ls dist/staging/*.aab) package_name:tech.aity.drive.staging track:internal

# The one human act: production Environment build -> Play production track.
promote:
  stage: promote
  image: registry.aity.tech/catalog/library/alpine:3.22
  tags: [docker, shared]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.+-aity-\d+$/
      when: manual
      allow_failure: true
  needs: [build, publish-staging]
  script:
    - |
      if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
        echo "NO-OP: PLAY_SERVICE_ACCOUNT_JSON is not set (no Google Play"
        echo "service account yet - M0). Skipping the Play production upload;"
        echo "the production AAB stays available as a pipeline artifact under dist/production/."
        exit 0
      fi
    - apk add --no-cache bash ruby ruby-dev build-base >/dev/null
    - gem install bundler --no-document
    - bundle install
    - bundle exec fastlane android deploy aab:$(ls dist/production/*.aab) package_name:tech.aity.drive track:production release_status:draft
